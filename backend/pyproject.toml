[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.8",
    "fastapi>=0.136.0",
    "google-genai>=1.73.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.27",
    "rapidfuzz>=3.14.5",
    "uvicorn>=0.46.0",
]

[dependency-groups]
indexing = [
    "reverse-geocode>=1.6.5",
    "imageio[ffmpeg]>=2.37.0",
    "Pillow>=11.0.0",
    "pillow-heif>=0.18.0",
    "pyexiftool>=0.5.6",
    "timm>=1.0.22",
    "torch>=2.9.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
# `uv sync` installs every group by default (dev + indexing) so local development
# and the full test suite work without remembering --group flags.
# The participant distribution stays lean: start.sh runs `uv sync --no-default-groups`
# to install only the runtime `dependencies` above (no Pillow/torch/etc.).
default-groups = ["dev", "indexing"]
